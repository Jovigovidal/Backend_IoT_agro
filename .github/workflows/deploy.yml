name: Despliegue Produccion IOT

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sincronizar codigo nuevo
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Actualizar dependencias y optimizar Laravel
        env:
          CACHE_STORE: array
          CACHE_DRIVER: array
        run: |
          set -euo pipefail
          cd backend

          mkdir -p \
            bootstrap/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/framework/cache \
            storage/logs

          chmod -R ug+rwX bootstrap/cache storage

          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan optimize:clear
