name: Despliegue Produccion IOT

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar código desde GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Preparar dependencias
        working-directory: backend
        env:
          CACHE_STORE: array
          CACHE_DRIVER: array
        run: |
          set -euo pipefail

          mkdir -p \
            bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs

          chmod u+rwx,g+rwx bootstrap/cache
          find storage -type d -exec chmod ug+rwx {} \;

          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

      - name: Publicar código en producción
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/backend"
          TARGET="/home/jovi_go/Escritorio/IOT_BACKEND-APP/Backend_IoT_agro/backend"

          test -f "$SOURCE/artisan"
          test -f "$TARGET/artisan"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            "$SOURCE/" "$TARGET/"

          cd "$TARGET"

          mkdir -p \
            bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs

          chmod u+rwx,g+rwx bootstrap/cache
          find storage -type d -exec chmod ug+rwx {} \;

          # Limpia configuración sin usar la caché de base de datos.
          php artisan config:clear

          # Ejecuta migraciones contra la base definida en el .env del servidor.
          php artisan migrate --force

          # Usa temporalmente la caché en memoria para evitar un fallo
          # si la tabla cache todavía no existe.
          CACHE_STORE=array php artisan optimize:clear

          echo "Commit desplegado:"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD