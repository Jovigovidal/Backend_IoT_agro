name: Despliegue Produccion IOT

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sincronizar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Preparar Laravel
        working-directory: backend
        env:
          CACHE_STORE: array
          CACHE_DRIVER: array
        run: |
          set -euo pipefail

          mkdir -p \
            bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs

          # Cambiar permisos únicamente de directorios.
          # No modificar recursivamente archivos de storage.
          chmod u+rwx,g+rwx bootstrap/cache
          find storage -type d -exec chmod ug+rwx {} \;

          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          php artisan optimize:clear

      - name: Publicar backend en producción
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/backend"
          TARGET="/home/jovi_go/Escritorio/IOT_BACKEND-APP/Backend_IoT_agro/backend"

          test -d "$SOURCE"
          test -d "$TARGET"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            "$SOURCE/" "$TARGET/"

          cd "$TARGET"

          mkdir -p \
            bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs

          chmod u+rwx,g+rwx bootstrap/cache
          find storage -type d -exec chmod ug+rwx {} \;

          php artisan optimize:clear

          echo "Commit desplegado:"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD